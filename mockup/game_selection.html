<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameCenter — Elige tu juego</title>
<link rel="stylesheet" href="game_selection.css">
</head>
<body>

  <header class="topbar">
    <button class="player-btn">
      <span class="icon-circle">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
        </svg>
      </span>
      <span>Jugador</span>
    </button>

    <div class="brand">
      <div class="brand-logo">G</div>
      <h1>GAMECENTER</h1>
      <p class="brand-sub">ELIGE TU JUEGO</p>
    </div>

    <button class="settings-btn" aria-label="Configuración">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 13a7.97 7.97 0 0 0 0-2l2-1.6-2-3.4-2.4 1a8 8 0 0 0-1.7-1L15 3h-6l-.3 2.6a8 8 0 0 0-1.7 1l-2.4-1-2 3.4L4.6 11a8 8 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a8 8 0 0 0 1.7 1L9 21h6l.3-2.6a8 8 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6Z"/>
      </svg>
    </button>
  </header>

  <main class="stage">
    <button class="nav-arrow nav-left" aria-label="Anterior">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>

    <div class="card-row">

      <article class="game-card card-blue">
        <h2 class="game-title">RUMMY</h2>
        <div class="game-art">
          <div class="tile tile-1">7</div>
          <div class="tile tile-2">7</div>
          <div class="tile tile-3">7</div>
          <div class="tile tile-4">11</div>
        </div>
        <p class="game-desc">Combina fichas, forma grupos y series.</p>
        <button class="enter-btn">ENTRAR</button>
      </article>

      <article class="game-card card-green selected">
        <h2 class="game-title">CUCARRACHA</h2>
        <div class="game-art">
          <div class="board board-round">
            <span class="marble m1"></span>
            <span class="marble m2"></span>
            <span class="marble m3"></span>
            <span class="marble m4"></span>
            <span class="marble m5"></span>
            <span class="marble m6"></span>
            <span class="cockroach">🪳</span>
          </div>
          <div class="dice-float">
            <span class="die d1">⚄</span>
            <span class="die d2">⚀</span>
            <span class="die d3">⚅</span>
          </div>
        </div>
        <p class="game-desc">Apuesta, lanza los dados y evita a la cucaracha.</p>
        <button class="enter-btn">ENTRAR</button>
      </article>

      <article class="game-card card-purple">
        <h2 class="game-title">BENDITO 7</h2>
        <div class="game-art">
          <div class="board board-grid">
            <span>1</span><span>2</span><span>3</span>
            <span>4</span><span>5</span><span>6</span>
            <span>7</span><span>8</span><span>9</span>
          </div>
          <div class="dice-float dice-top">
            <span class="die d1">⚁</span>
            <span class="die d2">⚂</span>
          </div>
        </div>
        <p class="game-desc">Completa los números y busca el Bendito 7.</p>
        <button class="enter-btn">ENTRAR</button>
      </article>

      <article class="game-card card-teal">
        <h2 class="game-title">¿POR QUÉ<br>SIEMPRE YO?</h2>
        <div class="game-art">
          <div class="board board-wheel">
            <span class="marble wm1"></span>
            <span class="marble wm2"></span>
            <span class="marble wm3"></span>
            <span class="marble wm4"></span>
            <span class="marble wm5"></span>
            <span class="marble wm6"></span>
            <span class="marble wm7"></span>
            <span class="marble wm8"></span>
          </div>
        </div>
        <p class="game-desc">La suerte rueda… ¿te tocará a ti esta vez?</p>
        <button class="enter-btn">ENTRAR</button>
      </article>

    </div>

    <button class="nav-arrow nav-right" aria-label="Siguiente">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </button>
  </main>

  <div class="floor"></div>

</body>
</html>
